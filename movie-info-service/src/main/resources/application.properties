server.port=8082
spring.application.name=movie-info-service
api.key=${MOVIE_API_KEY:}
spring.datasource.url=jdbc:postgresql://localhost:5432/movieinfocon
spring.datasource.username=${POSTGRES_USER:myuser}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
