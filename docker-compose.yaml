services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - postgres

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - postgres

  movie_catalogue_service:
    build:
      context: ./movie-catalog-service/
    ports:
      - "8081:8081"
    environment:
      - eureka.client.serviceUrl.defaultZone=http://discovery:8761/eureka
      - eureka.client.register-with-eureka=true
      - eureka.client.fetch-registry=true
    networks:
      - postgres
    depends_on:
      - discovery
      - movie_info_service
      - movie_data_service

  movie_info_service:
    build:
      context: ./movie-info-service/
    ports:
      - "8082:8082"
    environment:
      - spring.datasource.url=jdbc:postgresql://postgres:5432/movieinfocon
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MOVIE_API_KEY=${MOVIE_API_KEY}
      - eureka.client.serviceUrl.defaultZone=http://discovery:8761/eureka
      - eureka.client.register-with-eureka=true
      - eureka.client.fetch-registry=true
    networks:
      - postgres
    depends_on:
      - discovery
      - postgres

  movie_data_service:
    build:
      context: ./ratings-data-service/
    ports:
      - "8083:8083"
    environment:
      - spring.datasource.url=jdbc:postgresql://postgres:5432/ratingsdatacon
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - eureka.client.serviceUrl.defaultZone=http://discovery:8761/eureka
      - eureka.client.register-with-eureka=true
      - eureka.client.fetch-registry=true
    networks:
      - postgres
    depends_on:
      - discovery
      - postgres

  discovery:
    build:
      context: ./discovery-server/
    ports:
      - "8761:8761"
    networks:
      - postgres

  api_gateway:
    build:
      context: ./api-Gateway/
    ports:
      - "8084:8084"
    networks:
      - postgres
    environment:
      - eureka.client.serviceUrl.defaultZone=http://discovery:8761/eureka
      - eureka.client.register-with-eureka=true
      - eureka.client.fetch-registry=true
    depends_on:
      - discovery

volumes:
  dbdata:

networks:
  postgres:
    driver: bridge
